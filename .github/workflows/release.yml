# Builds clani for the Asciiverse catalog: one archive per target,
# clani-<target>.tar.gz, plus SHA256SUMS, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). Runs on a pushed tag
# of ours (*-av.*), or by hand for an existing tag.
#
# Only the clani target is built; the unit tests (Boost) stay off. Linux
# builds run in Alpine and link ncursesw and menuw statically, so the
# binaries carry the -musl triple av looks for first. macOS does the same
# with ncurses built from source for each architecture: the system's
# libmenu exports no symbols (its SDK stub lists none, so new_menu and the
# rest do not link), and its ncurses is 5.7. That ncurses reads the
# system's terminfo in /usr/share/terminfo. No Windows build: clani uses
# POSIX signals and ioctl, and PDCurses has no menu library.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NCURSES_VERSION: "6.5"
  NCURSES_SHA256: 136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base cmake ncurses-dev ncurses-static &&
            LDFLAGS="-static -s" asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/clani

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: ncurses, static, with its menu library
        run: |
          curl -sfLO --retry 8 --retry-delay 15 --retry-all-errors \
            "https://ftp.gnu.org/gnu/ncurses/ncurses-$NCURSES_VERSION.tar.gz"
          echo "$NCURSES_SHA256  ncurses-$NCURSES_VERSION.tar.gz" | shasum -a 256 -c
          tar -xzf "ncurses-$NCURSES_VERSION.tar.gz" -C "$RUNNER_TEMP"
          rm "ncurses-$NCURSES_VERSION.tar.gz"
          cd "$RUNNER_TEMP/ncurses-$NCURSES_VERSION"
          # the arm64 runner cross-builds x86_64; build tools stay native
          ./configure --build=aarch64-apple-darwin --host=${{ matrix.target }} --with-build-cc=cc \
            CC="cc -arch ${{ matrix.arch }}" CFLAGS=-O2 \
            --prefix="$RUNNER_TEMP/ncurses" --enable-widec --enable-overwrite \
            --without-shared --without-debug --without-cxx --without-cxx-binding \
            --without-ada --without-progs --without-tests --without-manpages \
            --disable-db-install --disable-mixed-case \
            --with-default-terminfo-dir=/usr/share/terminfo \
            --with-terminfo-dirs=/usr/share/terminfo
          make -j3
          make install
          ls "$RUNNER_TEMP/ncurses/lib"

      - name: Build and package
        run: |
          nc="$RUNNER_TEMP/ncurses"
          CURSES_LIBS="$nc/lib/libmenuw.a;$nc/lib/libncursesw.a" \
            CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_CXX_FLAGS=-I$nc/include" \
            asciiverse/build.sh
          strip out/clani
          file out/clani
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "CLiAni $TAG" \
                 --notes "CLiAni ${TAG%%-av.*} from github.com/hu-ry/CLiAni, Ryan Huth's scrolling noise patterns, built for the Asciiverse catalog. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
